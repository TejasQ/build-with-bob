# Checks https://www.youtube.com/@ibm-bob/streams every 6 hours. When a new Building with Bob
# stream appears, it downloads captions + metadata, registers it in data/episodes.json and
# pushes straight to main. The episode page goes live once its post is written
# (see AGENTS.md → "Living site loop").
name: Sync streams

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-streams
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      # yt-dlp needs a JavaScript runtime (Deno by default) to solve YouTube's player challenges.
      - uses: denoland/setup-deno@v2
      - name: Detect and ingest new streams
        shell: bash
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YT_COOKIES_FILE="$RUNNER_TEMP/cookies.txt"
          fi
          python3 scripts/sync_streams.py | tee sync.json
      - name: Commit and push to main
        run: |
          git add data/episodes.json data/transcripts
          if git diff --cached --quiet; then
            echo "No new streams."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          titles=$(python3 -c 'import json;print(", ".join(n["title"] for n in json.load(open("sync.json"))["new"]))')
          git commit -m "Ingest new stream(s): ${titles}"
          pushed=0
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && { pushed=1; break; }
            echo "Push attempt ${attempt} failed; retrying…"
            sleep $((attempt * 10))
          done
          [ "$pushed" = 1 ]
      - name: Fail loudly on streams that could not be fetched
        run: |
          python3 - <<'PY'
          import json, sys
          failed = json.load(open("sync.json"))["failed"]
          for f in failed:
              print(f"::error title=Stream fetch failed::{f['id']} {f['title']}: {f['reason']}")
          sys.exit(1 if failed else 0)
          PY
