# Checks https://www.youtube.com/@ibm-bob/streams every 6 hours. When a new Building with Bob
# stream appears, it downloads captions + metadata, registers it in data/episodes.json and
# opens a PR labelled `needs-writeup`. The episode page goes live once a post is written
# (see AGENTS.md → "Living site loop").
name: Sync streams

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Detect and ingest new streams
        id: sync
        run: |
          python3 scripts/sync_streams.py | tee sync.json
          echo "new=$(python3 -c 'import json;print(len(json.load(open("sync.json"))["new"]))')" >> "$GITHUB_OUTPUT"
      - name: Open PR for new episodes
        if: steps.sync.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="streams/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/episodes.json data/transcripts
          git commit -m "Ingest new Building with Bob streams"
          git push origin "$branch"
          gh label create needs-writeup --color a56eff --force
          gh pr create --title "New stream(s): write-ups needed" --label needs-writeup \
            --body "$(printf 'New streams detected on @ibm-bob/streams:\n\n```json\n%s\n```\n\nFollow AGENTS.md → Living site loop.' "$(cat sync.json)")"
