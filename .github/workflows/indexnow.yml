# After every successful production deploy (Vercel posts a deployment_status), push every
# sitemap URL to IndexNow so Bing (and ChatGPT search / Copilot, which use Bing) recrawl fast.
name: IndexNow

on:
  deployment_status:

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm indexnow
